<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>estilolibre.eu — isidromerayo</title>
  <meta name="description" content="estilolibre.eu — rincón personal de Isidro Merayo Castellano. Indie rock electro pop y redes." />
  <meta property="og:title" content="estilolibre.eu" />
  <meta property="og:description" content="Rincón personal de isidromerayo — redes y contacto." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://estilolibre.eu" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script>
    // El tema se aplica antes del primer pintado para que no haya flash.
    // Sin este script (o sin JS) la página queda en el modo oscuro de siempre.
    try {
      if (localStorage.getItem("theme") === "light") {
        document.documentElement.dataset.theme = "light";
      }
    } catch (err) {
      /* localStorage bloqueado: mantener oscuro */
    }
  </script>
  <link rel="stylesheet" href="styles.css?v=8" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>

  <div class="crt" aria-hidden="true"></div>

  <main class="wrap">
    <h1 class="sr-only">Isidro Merayo Castellano — estilolibre.eu</h1>

    <div class="terminal">
      <div class="terminal__bar">
        <span class="terminal__title">Terminal — estilolibre.eu: ~</span>
        <div class="terminal__actions">
          <!-- el botón va fuera de .terminal__controls: ese div es aria-hidden
               y un elemento focusable dentro sería invisible para lectores -->
          <button type="button" class="theme-toggle" id="theme" aria-pressed="false">
            <span class="theme-toggle__glyph" aria-hidden="true">&#x2600;&#xFE0E;</span>
            <span class="sr-only">colores claros</span>
          </button>
          <div class="terminal__controls" aria-hidden="true">
            <span class="win-btn">–</span>
            <span class="win-btn">&#x25A1;&#xFE0E;</span>
            <span class="win-btn win-btn--close">×</span>
          </div>
        </div>
      </div>

      <div class="terminal__body" id="term">
        <!-- las líneas se escriben desde script.js -->
      </div>
    </div>

    <footer class="footer">
      <span>© <span id="year">2026</span> estilolibre.eu</span>
      <span class="footer__meta">
        <span class="footer__dim">html puro, sin frameworks y con IA</span>
        <span id="deployed">desplegado <time datetime="__DEPLOYED_ISO__">__DEPLOYED_LABEL__</time></span>
      </span>
    </footer>
  </main>

  <script src="script.js?v=8"></script>
</body>
</html>
